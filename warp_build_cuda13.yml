name: warp_build_cuda13
# CUDA 13 counterpart of warp_build.yml, for drivers that support CUDA 13 (R580 and newer).
# CUDA 13 cannot target compute capability below 7.5: Pascal and Volta GPUs (e.g. GTX 10x0, V100)
# need the CUDA 12.9 environment in warp_build.yml.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - libtiff
  - fontconfig
  - python
  - pytorch=2.13.*=cuda130*
  - fftw
  - cmake<4
  - make
  - cxx-compiler=1.3
  - sysroot_linux-64=2.28
  - dotnet=10.0
  - cuda-version=13.0
  - cuda-nvcc=13.0
  - cuda-cudart-dev
  - cuda-cudart-static
  - libcufft-dev
  - libcublas-dev
  - libcurand-dev
  - cuda-nvrtc-dev
